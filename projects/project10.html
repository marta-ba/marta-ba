    <!-- Recommendation -->
    <div class="recommendation">
      <div class="rec-badge">Priority Fix</div>
      <div class="rec-title">Fix the Shipping → Payment wall</div>
      <p class="rec-body">The Shipping → Payment step loses <strong>3,164 mobile users</strong> — more than any other transition in the funnel. On mobile this step typically renders a long-form address + delivery-options layout followed by a slow-loading payment iframe. The combination of cognitive load and performance friction is a well-documented mobile conversion killer.</p>
      <p class="rec-body"><strong>Recommended interventions:</strong></p>
      <ul class="content-text" style="color:#c5c0b8; margin-bottom:1rem; padding-left:1.5rem;">
        <li>Collapse shipping + payment into a single scrollable step (reduce context switches).</li>
        <li>Lazy-load the payment iframe only after address validation, cutting perceived wait time.</li>
        <li>Surface saved addresses and Apple Pay / Google Pay above the fold — one-tap acceleration for returning users.</li>
        <li>Add a progress indicator: mobile users who see where they are in a flow show higher completion rates.</li>
      </ul>
      <div class="rec-hypothesis">
        <strong>Business hypothesis:</strong> A +2 pp improvement in Shipping → Payment CVR (60.1% → 62.1%) would recover approximately <strong>€8,600 per cohort period</strong> at current AOV. A +5 pp gain reaches <strong>€21,500</strong>. These are conservative estimates based on the dataset's observed AOV of €54.09.
      </div>
    </div>

<!-- ─── METHODOLOGY ─── -->
<section class="content-section dark" id="methodology">
  <div class="inner">
    <h2 class="section-heading">Methodology</h2>

    <h3 class="section-subheading">Data source</h3>
    <div class="content-text">
      <p><strong>BigQuery public dataset:</strong> <code>bigquery-public-data.ga4_obfuscated_sample_ecommerce</code> — a real obfuscated GA4 export from a Google Merchandise Store property.</p>
      <p>Filtered to <code>device.category = 'mobile'</code> exclusively. Five GA4 events mapped to funnel steps: <code>add_to_cart</code>, <code>begin_checkout</code>, <code>add_shipping_info</code>, <code>add_payment_info</code>, <code>purchase</code>.</p>
    </div>

    <h3 class="section-subheading">SQL — funnel view</h3>
    <div class="code-block"><pre><span class="cm">-- Step 1: flatten events per user</span>
<span class="kw">WITH</span> mobile_events <span class="kw">AS</span> (
  <span class="kw">SELECT</span>
    user_pseudo_id,
    event_name,
    (<span class="kw">SELECT</span> value.double_value
     <span class="kw">FROM</span> UNNEST(event_params)
     <span class="kw">WHERE</span> key = <span class="st">'value'</span>) <span class="kw">AS</span> purchase_value
  <span class="kw">FROM</span> <span class="st">`bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`</span>
  <span class="kw">WHERE</span>
    device.category = <span class="st">'mobile'</span>
    <span class="kw">AND</span> event_name <span class="kw">IN</span> (
      <span class="st">'add_to_cart'</span>, <span class="st">'begin_checkout'</span>, <span class="st">'add_shipping_info'</span>,
      <span class="st">'add_payment_info'</span>, <span class="st">'purchase'</span>
    )
),

<span class="cm">-- Step 2: pivot into one row per user</span>
mobile_funnel <span class="kw">AS</span> (
  <span class="kw">SELECT</span>
    user_pseudo_id,
    <span class="fn">MAX</span>(<span class="kw">IF</span>(event_name = <span class="st">'add_to_cart'</span>,       1, 0)) <span class="kw">AS</span> step_cart,
    <span class="fn">MAX</span>(<span class="kw">IF</span>(event_name = <span class="st">'begin_checkout'</span>,     1, 0)) <span class="kw">AS</span> step_checkout,
    <span class="fn">MAX</span>(<span class="kw">IF</span>(event_name = <span class="st">'add_shipping_info'</span>,  1, 0)) <span class="kw">AS</span> step_shipping,
    <span class="fn">MAX</span>(<span class="kw">IF</span>(event_name = <span class="st">'add_payment_info'</span>,   1, 0)) <span class="kw">AS</span> step_payment,
    <span class="fn">MAX</span>(<span class="kw">IF</span>(event_name = <span class="st">'purchase'</span>,           1, 0)) <span class="kw">AS</span> step_purchase,
    <span class="fn">SUM</span>(<span class="kw">IF</span>(event_name = <span class="st">'purchase'</span>, purchase_value, 0)) <span class="kw">AS</span> revenue
  <span class="kw">FROM</span> mobile_events
  <span class="kw">GROUP BY</span> user_pseudo_id
)

<span class="cm">-- Saved as view: `project.analytics_us.x_mobile_funnel`</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> mobile_funnel</pre></div>

    <h3 class="section-subheading">Metrics derived</h3>
    <div class="code-block"><pre><span class="cm">-- Step-level aggregation + business metrics</span>
<span class="kw">SELECT</span>
  <span class="fn">SUM</span>(step_cart)                                              <span class="kw">AS</span> n_cart,
  <span class="fn">SUM</span>(step_checkout)                                          <span class="kw">AS</span> n_checkout,
  <span class="fn">SUM</span>(step_shipping)                                          <span class="kw">AS</span> n_shipping,
  <span class="fn">SUM</span>(step_payment)                                           <span class="kw">AS</span> n_payment,
  <span class="fn">SUM</span>(step_purchase)                                          <span class="kw">AS</span> n_purchase,
  <span class="fn">SUM</span>(revenue)                                                <span class="kw">AS</span> total_revenue,
  <span class="fn">SAFE_DIVIDE</span>(<span class="fn">SUM</span>(step_checkout), <span class="fn">SUM</span>(step_cart))           <span class="kw">AS</span> cvr_cart_checkout,
  <span class="fn">SAFE_DIVIDE</span>(<span class="fn">SUM</span>(step_shipping), <span class="fn">SUM</span>(step_checkout))       <span class="kw">AS</span> cvr_checkout_ship,
  <span class="fn">SAFE_DIVIDE</span>(<span class="fn">SUM</span>(step_payment),  <span class="fn">SUM</span>(step_shipping))       <span class="kw">AS</span> cvr_ship_payment,
  <span class="fn">SAFE_DIVIDE</span>(<span class="fn">SUM</span>(step_purchase), <span class="fn">SUM</span>(step_payment))        <span class="kw">AS</span> cvr_payment_purchase,

  <span class="cm">-- Revenue at Risk = users_lost × AOV</span>
  (<span class="fn">SUM</span>(step_cart)     - <span class="fn">SUM</span>(step_checkout)) * avg_order_value  <span class="kw">AS</span> rar_cart,
  (<span class="fn">SUM</span>(step_shipping) - <span class="fn">SUM</span>(step_payment))  * avg_order_value  <span class="kw">AS</span> rar_shipping
<span class="kw">FROM</span> x_mobile_funnel, totals</pre></div>

<!-- ─── LIMITATIONS ─── -->
<section class="content-section">
  <div class="inner">
    <h2 class="section-heading">Limitations & honesty</h2>
    <div class="content-text">
      <p>The dataset is <strong>obfuscated</strong> — user IDs and some values are anonymised, which may introduce minor counting artefacts (e.g. the Checkout → Shipping CVR slightly exceeds 100%, indicating cross-session event attribution quirks in the public sample).</p>
      <p>Revenue values of <code>0.0</code> are present for some confirmed purchasers, likely due to obfuscation of order value. AOV is computed only over transactions with <code>revenue > 0</code> to avoid deflation.</p>
      <p>The Revenue-at-Risk figures are <strong>indicative</strong>, not a guaranteed recovery number. Actual uplift from UX improvements depends on implementation quality, device distribution, and market context.</p>
    </div>
  </div>
</section>
